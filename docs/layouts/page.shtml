<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
	<div class="docs">
		<nav class="sidebar" aria-label="Documentation">
			<p class="sidebar-group">Start here</p>
			<a href="$site.page('').link()">Introduction</a>
			<a href="$site.page('install').link()" class="$site.page('install').isCurrent().then('active', '')">Install</a>
			<p class="sidebar-group">Core</p>
			<a href="$site.page('watchers').link()" class="$site.page('watchers').isCurrent().then('active', '')">Watchers</a>
			<a href="$site.page('configuration').link()" class="$site.page('configuration').isCurrent().then('active', '')">Configuration</a>
			<p class="sidebar-group">Integrations</p>
			<a href="$site.page('neovim').link()" class="$site.page('neovim').isCurrent().then('active', '')">Neovim</a>
			<p class="sidebar-group">Project</p>
			<a href="$site.page('develop').link()" class="$site.page('develop').isCurrent().then('active', '')">Develop</a>
		</nav>
		<main class="doc">
			<p class="eyebrow">Documentation</p>
			<h1 :text="$page.title"></h1>
			<p class="lede" :text="$page.description"></p>
			<article class="prose" :html="$page.content()"></article>
			<footer class="pager">
				<ctx :if="$page.nextPage?()">
					<a class="prev" href="$if.link()"><small>Previous</small><strong :text="$if.title"></strong></a>
				</ctx>
				<ctx :if="$page.prevPage?()">
					<a class="next" href="$if.link()"><small>Next</small><strong :text="$if.title"></strong></a>
				</ctx>
			</footer>
		</main>
		<aside class="toc">
			<p class="toc-title">On this page</p>
			<ul class="toc-list"></ul>
		</aside>
	</div>
</body>
