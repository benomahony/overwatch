name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Claude Code for executable Claude acceptance scenarios
        run: npm install --global @anthropic-ai/claude-code@2.1.311

      - name: Check each sentence of the Markdown is on a line of its own
        run: python3 scripts/markdown_format.py --check

      - name: Test the hooks
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Test the integrations against fake hosts
        run: node --test tests/test_integrations.mjs tests/test_bounded_read.mjs tests/test_delivery.mjs tests/test_model_integrations.mjs tests/test_integration_contract.mjs

  oldest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Compile the engine and the hooks with the oldest Python the README names
        run: test -d engine && test -d integrations && python -m compileall -q engine integrations

      - name: Test the entry point with it
        run: python -m unittest discover -s tests -p 'test_engine_entry.py'

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Find whether the spec changed
        id: spec
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- spec; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Model check the timing spec
        if: steps.spec.outputs.changed == 'true'
        uses: benomahony/tla-check@7dab51c86bc6223aa2f62e7acb98050bb429f71f # v0.1.0

      - name: Verify implementation traces come from the current model
        if: steps.spec.outputs.changed == 'true'
        run: |
          curl -fsSL https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o "$RUNNER_TEMP/tla2tools.jar"
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          python3 scripts/model_traces.py --jar "$RUNNER_TEMP/tla2tools.jar" --check
          python3 scripts/integration_traces.py --jar "$RUNNER_TEMP/tla2tools.jar" --check

      - name: Validate traces of the real engine against the model
        if: steps.spec.outputs.changed == 'true'
        run: python3 tests/trace_validation.py --jar "$RUNNER_TEMP/tla2tools.jar"

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Codex sandboxes commands with bubblewrap, which Ubuntu's AppArmor stops from creating user namespaces.
      - name: Allow sandboxes to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the agents and the mock model
        run: |
          npm install --no-save @copilotkit/aimock@1.47.0 @mariozechner/pi-coding-agent@0.73.1 opencode-ai@1.19.5 @openai/codex@0.166.0 @anthropic-ai/claude-code@2.1.318
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test each agent against a scripted model
        run: node --test tests/test_agents.mjs

      - name: Test the Claude Code plugin in its runtime
        run: claude plugin test .

  neovim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Neovim
        run: |
          curl -sSfL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Test the Neovim plugin
        run: |
          nvim --headless -l tests/overwatch_spec.lua
          nvim --headless -l tests/model_spec.lua
          nvim --headless -l tests/integration_contract_spec.lua
