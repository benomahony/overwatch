#:schema https://raw.githubusercontent.com/benomahony/zanity/main/zanity.schema.json

# Unmodified third-party distribution; our math integration remains checked.
exclude = ["docs/assets/vendor/katex.min.js"]

[rules]
select = ["strict"]

# The project's words. A watcher is a watchers.json entry and, in every host, its live instance; a report is what one
# of its runs says; an outside change is another process's.
[vocabulary]
forbidden = ["util", "manager", "helper"]

[vocabulary.synonyms]
watcher = ["slot"]
report = ["outcome"]
outside = ["external"]

# What every host shares: the table, reading reports, the gate, and the formal model.
[contexts.domain]
include = ["watchers.json", "hooks/watchers.ts", "hooks/table.ts", "hooks/gating.ts", "hooks/gating.py", "hooks/records.py", "hooks/assert.ts", "spec/**"]
# No host is named outside integrations.
forbidden = ["claude", "codex", "opencode", "pi", "neovim", "nvim"]

# The shared engine that the agent hosts without a hook engine of their own drive.
[contexts.engine]
include = ["hooks/engine.py", "hooks/daemon.py", "hooks/triage.py", "hooks/unix.py", "integrations/check.js", "integrations/delivery.js"]
# No host is named outside integrations.
forbidden = ["claude", "codex", "opencode", "pi", "neovim", "nvim"]

# Every host's adapter, in one context, so they all use the same words.
[contexts.integrations]
include = ["hooks/register.ts", "integrations/codex.py", "integrations/codex-hooks.json", "integrations/opencode.js", "integrations/pi.js", "lua/**", "plugin/**"]
