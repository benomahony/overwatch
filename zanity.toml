#:schema https://raw.githubusercontent.com/benomahony/zanity/main/zanity.schema.json

# Unmodified third-party distribution; our math integration remains checked.
exclude = ["docs/assets/vendor/katex.min.js"]

[rules]
select = ["all"]

# The project's words, the result model's (spec/Overwatch.tla) wherever it has one. A watcher is a watchers.json entry
# and, in every host, its live instance; a report is what one of its runs says; an outside change is another process's.
# A timeout is how long a check may run, a deadline the moment that runs out. The session has touched the workspace
# once it edits after the commit its baseline belongs to, which keeps its first result from the baseline. A commit
# moves; a toolchain is replaced. In the model a change is quiet until its check starts; in the engine's daemon,
# watchers are settled once all have been inactive for a while, which is not the model's quiet.
[vocabulary]
forbidden = ["util", "manager", "helper"]

[vocabulary.synonyms]
watcher = ["slot"]
report = ["outcome"]
outside = ["external"]

# The shared engine that the agent hosts without a hook engine of their own drive: the Python engine, its daemon,
# and the JavaScript that runs it for in-process plugins. engine/gating.py and engine/records.py are domain, below.
[contexts.engine]
include = ["engine/**"]
# No host is named outside integrations.
forbidden = ["claude", "codex", "opencode", "pi", "neovim", "nvim"]

# The daemon's watchers are settled, or inactive: quiet is the model's word for a change whose check has not started.
[contexts.engine.synonyms]
settled = ["quiet"]

# What every host shares: the table, reading reports, the gate, and the formal model.
[contexts.domain]
include = ["watchers.json", "hooks/watchers.ts", "hooks/table.ts", "hooks/gating.ts", "engine/gating.py", "engine/records.py", "hooks/assert.ts", "spec/**"]
# No host is named outside integrations.
forbidden = ["claude", "codex", "opencode", "pi", "neovim", "nvim"]

# Every host's adapter, in one context, so they all use the same words.
[contexts.integrations]
include = ["integrations/**", "hooks/register.ts", "hooks/state.ts", "hooks/project.ts", "hooks/delivery.ts", "hooks/completion.ts",
           "hooks/toolchain.ts", "lua/**", "plugin/**"]
